<!DOCTYPE html>
<html>
<head>
  <title>Buy Me a Coffee ☕</title>
  <meta charset="UTF-8" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f8f9fa;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      background: #ffffff;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      width: 320px;
      text-align: center;
    }

    h2 {
      margin-top: 0;
      color: #202124;
    }

    input {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      margin: 12px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #ffdd00;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    #qr {
      margin-top: 16px;
    }

    .upi {
      font-size: 12px;
      color: #5f6368;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>☕ Buy Me a Coffee</h2>

    <input type="number" id="amount" placeholder="Enter amount (₹)" min="1" />

    <button onclick="generateQR()">Generate QR</button>

    <div id="qr"></div>

    <div class="upi">UPI ID: 8825662087@upi</div>
  </div>

  <!-- QR Code Library -->
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

  <script>
    function generateQR() {
      const amount = document.getElementById("amount").value;
      if (!amount || amount <= 0) {
        alert("Please enter a valid amount");
        return;
      }

      const upiLink =
        `upi://pay?pa=8825662087@upi&pn=Techloop%20Tamil&am=${amount}&cu=INR`;

      document.getElementById("qr").innerHTML = "";
      new QRCode(document.getElementById("qr"), {
        text: upiLink,
        width: 200,
        height: 200
      });
    }
  </script>

</body>
</html>
