<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Lab Resources</title>

<style>

body{
  margin:0;
  font-family:Arial;
  background:#202124;
  color:white;
}

.container{
  padding:16px;
}

.buttons{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

button,a{
  border:none;
  padding:8px 12px;
  border-radius:6px;
  cursor:pointer;
  text-decoration:none;
  font-size:13px;
}

.video{ background:#1a73e8; color:white; }
.github{ background:#24292e; color:white; }
.subscribe{ background:#ff0000; color:white; }
.coffee{ background:#ffdd00; color:black; }

</style>

</head>
<body>

<div class="container">

<div id="labTitle"></div>

<div class="buttons" id="buttons"></div>

</div>

<script>

const params =
  new URLSearchParams(window.location.search);

const lab =
  params.get("lab");

const video =
  params.get("video");

const github =
  params.get("github");

document.getElementById("labTitle").innerHTML =
  `<b>${lab}</b>`;

const btnContainer =
  document.getElementById("buttons");

if(video){

btnContainer.innerHTML +=
`<button class="video"
onclick="window.open('${video}')">
Watch Video
</button>`;
}

if(github){

btnContainer.innerHTML +=
`<button class="github"
onclick="window.open('${github}')">
GitHub Code
</button>`;
}

btnContainer.innerHTML +=
`<a class="subscribe"
href="https://www.youtube.com/@Techloop_Tamil"
target="_blank">Subscribe</a>`;

btnContainer.innerHTML +=
`<a class="coffee"
href="https://adhi2k.github.io/Extention_Videomap/upi.html"
target="_blank">Buy Coffee</a>`;

</script>

</body>
</html>
